name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No separate "Set up Android SDK" step — GitHub's ubuntu-latest
      # runners already come with the Android SDK pre-installed
      # (ANDROID_HOME / ANDROID_SDK_ROOT are already set). The
      # android-actions/setup-android action tries to additionally
      # install a legacy "tools" package that Google has since removed
      # from the SDK repository, which is why that step was failing —
      # skipping it avoids the problem entirely.
      - name: Accept Android SDK licenses (safety net)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Use the committed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masjid-azan-clock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
