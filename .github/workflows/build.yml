name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses (safety net)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Use the committed debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::debug.keystore is missing from the repo root! This build would sign with a random key instead, breaking in-place updates and forcing an uninstall. Add debug.keystore to the repo and push again."
            exit 1
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "Debug keystore found and applied — signature will match previous builds."

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: android
        # --no-build-cache: our keystore is copied into place by a plain
        # shell step above, outside Gradle's own dependency tracking, so
        # Gradle has no way to know when it changes. Without this flag,
        # Gradle's remote build cache can occasionally reuse an old,
        # already-signed APK from a previous run instead of actually
        # resigning with the keystore we just placed — which is exactly
        # what caused the "package conflicts" install error to resurface
        # even though the correct keystore was in place. This flag forces
        # a genuine fresh build and sign every single time.
        run: gradle assembleDebug --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masjid-azan-clock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
