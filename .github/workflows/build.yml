name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses (safety net)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify the committed debug keystore exists
        # android/app/build.gradle now points its debug signingConfig
        # DIRECTLY at this repo-root file by explicit path — no more
        # relying on Android's implicit default debug-keystore location,
        # which is what was actually causing the repeated mismatches (its
        # default didn't reliably line up with where earlier versions of
        # this workflow were copying the keystore to). This step is now
        # just a safety check that the file truly exists before building.
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::debug.keystore is missing from the repo root! The build would fail or sign with the wrong key. Add debug.keystore to the repo and push again."
            exit 1
          fi
          echo "Keystore SHA256 fingerprint (should be identical on every build):"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android \
            | grep "SHA256:" | tee /tmp/keystore_fingerprint.txt

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: android
        # --no-build-cache: our keystore is copied into place by a plain
        # shell step above, outside Gradle's own dependency tracking, so
        # Gradle has no way to know when it changes. Without this flag,
        # Gradle's remote build cache can occasionally reuse an old,
        # already-signed APK from a previous run instead of actually
        # resigning with the keystore we just placed — which is exactly
        # what caused the "package conflicts" install error to resurface
        # even though the correct keystore was in place. This flag forces
        # a genuine fresh build and sign every single time.
        run: gradle assembleDebug --no-build-cache

      - name: Verify the APK was actually signed with our keystore
        # This is the real safety net: don't just trust that the earlier
        # steps worked — directly check the finished APK's own embedded
        # certificate and compare it to the keystore we intended to use.
        # If they ever differ (e.g. a stale/old workflow re-run, a build
        # cache slipping through, anything), FAIL here instead of quietly
        # uploading a wrongly-signed APK that looks like a normal success
        # in the Actions UI — which is exactly what happened before this
        # check existed, and is what caused the repeated confusion.
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" META-INF/*.RSA > /tmp/apk_cert.rsa 2>/dev/null || unzip -p "$APK" META-INF/*.DSA > /tmp/apk_cert.rsa
          APK_FP=$(keytool -printcert -file /tmp/apk_cert.rsa | grep "SHA256:")
          EXPECTED_FP=$(cat /tmp/keystore_fingerprint.txt)
          echo "Keystore fingerprint: $EXPECTED_FP"
          echo "APK's actual fingerprint: $APK_FP"
          if [ "$APK_FP" != "$EXPECTED_FP" ]; then
            echo "::error::SIGNATURE MISMATCH — the built APK was NOT signed with the committed debug.keystore! Do not use this APK; installing it will conflict with previous installs. This usually means an old workflow run was re-run instead of triggering a fresh build from the latest commit."
            exit 1
          fi
          echo "✓ Confirmed: APK signature matches the committed keystore exactly."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masjid-azan-clock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
